$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Slideshow
group: DGI Components
description: UIKit based slideshow component
props:
  type: object
  properties:
    label:
      title: Label
      description: The title of the slideshow.
      type: string
    items:
      title: Items
      description: An array of items to render as Slide components. Each Slide expects 'image', 'title', 'content', 'alt', 'title_link' and 'slide_position' properties.
      type: array

libraryOverrides:
  dependencies:
    - exhibit_components/uikit
