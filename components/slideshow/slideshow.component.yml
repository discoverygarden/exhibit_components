name: Slideshow
group: DGI Components
description: UIKit based slideshow component
props:
  type: object
  properties:
    animation:
      title: Animation
      description: The animation style to use for the slides
      examples:
        - Slide, Fade, Scale, Pull, Push
      type: string
    autoplay:
      title: Auto Play
      description: Enables autoplay for the slideshow
      examples:
        - True or False
      type: string
slots:
  slide:
    title: Slideshow slide title
    description: Descriptive text for the slide
    image: The image media used as the slide.
libraryOverrides:
  css:
    component:
      https://cdn.jsdelivr.net/npm/uikit@3.23.6/dist/css/uikit.min.css: {}
  js:
    https://cdn.jsdelivr.net/npm/uikit@3.23.6/dist/js/uikit.min.js: { attributes: { defer: true } }
